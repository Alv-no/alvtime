name: Frontend V3 Build and Deploy Prod

on:
  workflow_run:
    workflows: ["Frontend V3 Build and Deploy Test"]
    types: [completed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Build and Deploy to Prod Job
    environment: prod
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/frontend-v3/package-lock.json
      - name: Set config
        working-directory: packages/frontend-v3
        run: cp public/config.prod.json public/config.json
      - name: Install and build
        working-directory: packages/frontend-v3
        run: |
          npm ci
          npm run build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATICWEBAPP_V3_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./packages/frontend-v3" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          skip_app_build: true # Built in the "Install and build" step above, from package-lock.json
          ###### End of Repository/Build Configurations ######